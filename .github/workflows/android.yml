name: Android build & release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can derive versionCode from `git rev-list --count`.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Read app version
        id: version
        working-directory: android
        run: |
          # Resolved from the build.gradle.kts `printVersion` task so it stays
          # in sync with what the APK actually reports.
          ./gradlew :app:printVersion -q --no-daemon | tee "$GITHUB_OUTPUT"

      - name: Rename APK to include version
        working-directory: android
        run: |
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          src=app/build/outputs/apk/debug/app-debug.apk
          out="app-debug-v${{ steps.version.outputs.base }}-build${{ steps.version.outputs.code }}-${short_sha}.apk"
          cp "$src" "app/build/outputs/apk/debug/$out"
          echo "VERSIONED_APK=android/app/build/outputs/apk/debug/$out" >> "$GITHUB_ENV"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ steps.version.outputs.base }}-build${{ steps.version.outputs.code }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.VERSIONED_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Refresh rolling 'latest-debug' release
        if: |
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
          || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BASE: ${{ steps.version.outputs.base }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          ref_name="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          title="Latest debug build · v${VERSION_BASE} (build ${VERSION_CODE})"
          notes=$(cat <<EOF
**Version:** \`${VERSION_BASE}\` (build ${VERSION_CODE})
**Branch:** \`${ref_name}\`
**Commit:** \`${short_sha}\`

Install on Android 8.0+.
EOF
)
          # Move the rolling tag to the new commit by recreating the release.
          gh release delete latest-debug --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-debug \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            "$VERSIONED_APK" \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
